<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Платежи — BillPay</title>
<meta name="description" content="BillPay — напоминания о регулярных платежах команды">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/assets/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BillPay">
<meta property="og:title" content="Платежи — BillPay">
<meta property="og:description" content="Напоминания о регулярных платежах команды: список, статусы, итоги по валютам и Telegram.">
<meta property="og:image" content="/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css?v=5">
<link rel="stylesheet" href="/assets/css/app.css?v=5">
<link rel="stylesheet" href="/assets/css/periods.css?v=5">
<!-- Тема до первой отрисовки — без мигания -->
<script>try{var t=localStorage.getItem('billpay-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='light'?'#F4F3EF':'#0A0A0A'}catch(e){}</script>
</head>
<body data-page="dashboard">
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="content">
      <div class="phead">
        <div><div class="lbl kicker">Периоды оплаты</div><h1>&nbsp;</h1></div>
        <span class="today" id="today"></span>
      </div>

      <div class="cards" id="cards"></div>

      <section class="card tgc tgc-m" id="tg-m"></section>

      <section class="card strip">
        <div class="sh"><span class="h3">Лента месяца</span><span class="mut">сроки и напоминания</span>
          <div class="leg"><span><i style="background:var(--paid)"></i>оплачено</span><span><i style="background:var(--sky)"></i>не оплачено</span><span><i style="background:var(--red)"></i>просрочено</span></div>
        </div>
        <div class="days" id="days"></div>
      </section>

      <section class="card pt" id="history">
        <div class="pt-h"><span class="h3">Периоды</span>
          <div class="mswitch" id="mnav" role="group" aria-label="Месяц"></div>
        </div>

        <!-- поиск по названию + валюта; на мобиле — липкая панель и кнопка фильтров -->
        <div class="pt-bar" id="bar">
          <label class="psearch" id="psearch">
            <span data-ic="search"></span>
            <input id="pq" type="search" placeholder="Поиск по названию" autocomplete="off" spellcheck="false" maxlength="100" aria-label="Поиск по названию платежа">
            <button type="button" class="pclear" id="pqclear" aria-label="Очистить поиск" hidden><span data-ic="x"></span></button>
          </label>
          <div class="fgroup">
            <div class="dd" id="ddCur">
              <button class="fbtn" type="button" data-dd="cur" aria-haspopup="true" aria-expanded="false"><span class="fl">Валюта</span><span class="fv" id="curVal">все</span><span data-ic="down"></span></button>
              <div class="pop" role="menu">
                <div class="lbl pop-h">Валюта</div>
                <div id="curOpts"></div>
              </div>
            </div>
          </div>
          <div class="mbtns">
            <button class="fbtn ic" type="button" data-sheet aria-label="Фильтры и сортировка"><span data-ic="filter"></span><span class="badge" id="fcount" hidden>0</span></button>
          </div>
        </div>

        <div class="pt-tabs">
          <div class="chips" id="tabs" role="group" aria-label="Фильтр по статусу">
            <button class="chip on" data-f="all" aria-pressed="true">Все<em></em></button>
            <button class="chip" data-f="unpaid" aria-pressed="false">Не оплачено<em></em></button>
            <button class="chip" data-f="overdue" aria-pressed="false">Просрочено<em></em></button>
            <button class="chip" data-f="paid" aria-pressed="false">Оплачено<em></em></button>
          </div>
          <button class="more reset-l" type="button" data-reset id="resetL" hidden>Сбросить</button>
        </div>

        <!-- итоги по найденным периодам, отдельно по каждой валюте -->
        <div class="pt-sum" id="psum"></div>

        <div class="grid gh" id="ghead" role="row"></div>
        <div id="rows" role="rowgroup" aria-live="polite"></div>
      </section>
    </div>
  </main>
</div>
<script src="/assets/js/icons.js?v=5"></script>
<!--BILLPAY_BOOT-->
<script src="/assets/js/api.js?v=5"></script>
<script src="/assets/js/app.js?v=5"></script>

<!-- мобильный bottom sheet: статус, валюта, сортировка -->
<div class="sheet-ov" id="sheet" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="Фильтры и сортировка">
    <div class="grab"></div>
    <div class="sh-h"><b>Фильтры</b><button class="more" type="button" data-reset>Сбросить</button></div>
    <div class="sh-b">
      <div class="sh-s"><div class="lbl">Статус</div><div class="sh-chips" id="shStatus"></div></div>
      <div class="sh-s"><div class="lbl">Валюта</div><div class="sh-chips" id="shCur"></div></div>
      <div class="sh-s"><div class="lbl">Сортировка</div><div class="sh-sort" id="shSort"></div><p class="pop-n">Сумма сортируется внутри каждой валюты — без конвертации</p></div>
    </div>
    <div class="sh-f"><button class="btn full lg" type="button" data-close-sheet id="shApply">Показать</button></div>
  </div>
</div>
</body>
</html>
