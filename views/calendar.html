<script>try{var t=localStorage.getItem('billpay-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='light'?'#F4F3EF':'#0A0A0A'}catch(e){}</script>

<body data-page="calendar">
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="content">
      <div class="phead">
        <div><div class="lbl kicker">Календарь платежей</div><h1>&nbsp;</h1></div>
        <span class="today" id="today"></span>
      </div>
      <div class="cal-wrap">
        <div class="cal-main">
          <section class="card" id="month"></section>
          <section class="card" id="ondate"></section>
        </div>
        <div class="aside">
          <section class="card" id="day"></section>
          <section class="card" id="upcoming"></section>
          <section class="card tgc" id="cal-tg"></section>
        </div>
      </div>
    </div>
  </main>
</div>
